# Die Datenbank liegt seit der Konsolidierung in der gemeinsamen Instanz
# (Stack unter /var/www/pg-shared, erreichbar als "pg-shared" im Netz
# hetzner-network). Der frühere postgres:15-alpine Service ist deshalb
# entfallen; sein Datenverzeichnis liegt noch im Volume
# mathe-quiz_postgres_data und kann weg, sobald die Umstellung stabil läuft.
services:
  validator:
    build:
      context: .
      dockerfile: validator/Dockerfile
    container_name: mathe-quiz-validator
    environment:
      PYTHONUNBUFFERED: 1
      PORT: ${VALIDATOR_INTERNAL_PORT:-8001}
    expose:
      - "${VALIDATOR_INTERNAL_PORT:-8001}"
    restart: unless-stopped

  # Der Servicename trägt den App-Slug, weil Compose ihn in JEDEM Netz als
  # Alias setzt — im hetzner-network also serverweit. Bis zum 9. August 2026
  # hieß dieser Service "backend" und der von mediathek genauso: ein Name mit
  # zwei Adressen, zwischen denen Dockers DNS rotiert. Begründung und der
  # Vorfall vom 8. August stehen in ARCHITEKTUR.md 6.1.
  # Der container_name bleibt, er war schon eindeutig.
  mathe-quiz-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mathe-quiz-backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-mathe_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env or --env-file}@pg-shared:5432/${POSTGRES_DB:-mathe_quiz}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env or --env-file}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://mathe-quiz.elmarhepp.de}
      VALIDATOR_URL: ${VALIDATOR_URL:-http://validator:8001}
    ports:
      - "127.0.0.1:${API_PORT:-3042}:3000"
    depends_on:
      validator:
        condition: service_started
    restart: unless-stopped
    # "default" muss hier explizit stehen: sobald ein Service networks:
    # deklariert, wird er dem Default-Netz nicht mehr automatisch zugeordnet -
    # mathe-quiz-api würde sonst den validator nicht mehr erreichen.
    networks:
      - default
      - hetzner-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://mathe-quiz-api.elmarhepp.de}
        VITE_LEGAL_NAME: ${VITE_LEGAL_NAME:-}
        VITE_LEGAL_EMAIL: ${VITE_LEGAL_EMAIL:-}
        VITE_LEGAL_ADDRESS_LINE_1: ${VITE_LEGAL_ADDRESS_LINE_1:-}
        VITE_LEGAL_ADDRESS_LINE_2: ${VITE_LEGAL_ADDRESS_LINE_2:-}
        VITE_LEGAL_COUNTRY: ${VITE_LEGAL_COUNTRY:-}
        VITE_LEGAL_CONTENT_RESPONSIBLE: ${VITE_LEGAL_CONTENT_RESPONSIBLE:-}
    container_name: mathe-quiz-frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-3041}:80"
    depends_on:
      - mathe-quiz-api
    restart: unless-stopped

networks:
  hetzner-network:
    external: true
